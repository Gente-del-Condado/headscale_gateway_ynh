Builds:
  - versionName: 1.4.7-android.5
    versionCode: 10040075
    commit: b14a986ae84047b5d407ecc1866bb0ae4b711ca1
    subdir: android
    gradle:
      - yes
    prebuild:
      - sed -i '/^ndk.dir=/d' local.properties
      - sed -i -e "s/^    namespace /    namespace = /" -e "s/^    ndkVersion /    ndkVersion = /" build.gradle
      - sed -i 's/stopForeground(true)/stopForeground(STOP_FOREGROUND_REMOVE)/g' src/main/java/org/headscalegateway/android/GatewayService.java src/main/java/org/headscalegateway/android/GatewayVpnService.java
    build:
      - curl -fLo /tmp/hgw-go.tar.gz https://go.dev/dl/go1.27.4.linux-amd64.tar.gz
      - echo '7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840  /tmp/hgw-go.tar.gz'
        | sha256sum -c -
      - mkdir -p ../builds/fdroid-toolchain
      - tar -xzf /tmp/hgw-go.tar.gz -C ../builds/fdroid-toolchain
      - export PATH="$PWD/../builds/fdroid-toolchain/go/bin:$PATH"
      - export GOTOOLCHAIN=local
      - python3 ../tools/build_android_apk.py --release --channel fdroid --prepare-only
        --sdk $$SDK$$ --ndk $$NDK$$
    buildjni:
      - no
    ndk: 27.0.12077973
    gradleprops:
      - releaseChannel=fdroid

AutoUpdateMode: None
UpdateCheckMode: None
