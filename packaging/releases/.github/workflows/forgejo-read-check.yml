name: Verificar lectura privada de Forgejo
'on':
  workflow_dispatch:
env:
  HGW_SOURCE_BACKEND: ${{ vars.HGW_SOURCE_BACKEND || 'forgejo' }}
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Seleccionar la release estable sin leer el historial privado
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FORGEJO_RELEASE_READ_TOKEN: ${{ secrets.FORGEJO_RELEASE_READ_TOKEN }}
          MIRROR_READ_TOKEN: ${{ secrets.MIRROR_READ_TOKEN }}
        run: python3 automation/forgejo_source.py --plan
      - name: Descargar y verificar el commit publicado
        if: steps.release.outputs.source_sha != ''
        env:
          FORGEJO_RELEASE_READ_TOKEN: ${{ secrets.FORGEJO_RELEASE_READ_TOKEN }}
          MIRROR_READ_TOKEN: ${{ secrets.MIRROR_READ_TOKEN }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: python3 automation/forgejo_source.py --sha "$SOURCE_SHA" --version "$RELEASE_VERSION" --destination "$RUNNER_TEMP/source"
      - name: Verificar la firma Android existente sin compilar
        if: steps.release.outputs.source_sha != ''
        env:
          HGW_ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: python3 "$RUNNER_TEMP/source/tools/android_ci_signing.py" --check
      - name: Comprobar acceso de publicación sin modificar los destinos
        env:
          GH_TOKEN: ${{ secrets.PUBLICATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          probe=$(mktemp -d "$RUNNER_TEMP/hgw-publication-probe.XXXXXX")
          trap 'rm -rf -- "$probe"' EXIT
          for repository in headscale_gateway_releases headscale_gateway_flatpak headscale_gateway_ynh headscale_gateway_ha Mis_app_ha Mis_componente_ha; do
            test "$(gh api "repos/Gente-del-Condado/$repository" --jq .private)" = false
            git clone --depth=1 --no-checkout "https://github.com/Gente-del-Condado/$repository.git" "$probe/repository"
            git -C "$probe/repository" push --dry-run origin HEAD:refs/heads/main
            rm -rf -- "$probe/repository"
          done
          echo 'DESTINOS_PUBLICOS_ESCRITURA_DRY_RUN_OK: ninguna referencia modificada'
