name: Publicar fuentes reutilizables del escritorio
'on':
  push:
    branches: [main]
    paths:
      - automation/desktop_sources.py
      - automation/check_release_reuse.py
      - automation/test_desktop_sources.py
      - automation/desktop-sources.lock.json
      - automation/split_release.py
      - automation/publish_public_release.py
      - .github/workflows/desktop-sources.yml
permissions:
  contents: read
concurrency:
  group: desktop-corresponding-sources
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Ensayar reutilización y separación de la próxima entrega
        run: python3 -B -m unittest discover -s automation -p 'test_desktop_sources.py'
      - name: Consultar fuentes existentes sin credenciales ni subidas
        id: existing
        run: python3 automation/check_release_reuse.py --lock automation/desktop-sources.lock.json --allow-missing
      - name: Publicar una copia verificada sin modificar la 1.4.16
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.PUBLICATION_TOKEN }}
        run: python3 automation/desktop_sources.py --lock automation/desktop-sources.lock.json --seed-from v1.4.16 --output "$RUNNER_TEMP/desktop-sources" --publish
      - name: Confirmar acceso anónimo al conjunto reutilizable
        run: python3 automation/check_release_reuse.py --lock automation/desktop-sources.lock.json
