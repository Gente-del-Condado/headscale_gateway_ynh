name: Verificar espejo privado sin publicar
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Gente-del-Condado/headscale_gateway_releases'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HGW_SOURCE_BACKEND: github-mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Probar los contratos del lector sin credenciales
        run: python3 -B -m unittest discover -s automation -p 'test_*.py'
      - name: Contrastar la release estable y la etiqueta del espejo
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FORGEJO_RELEASE_READ_TOKEN: ${{ secrets.FORGEJO_RELEASE_READ_TOKEN }}
          MIRROR_READ_TOKEN: ${{ secrets.MIRROR_READ_TOKEN }}
        run: python3 automation/forgejo_source.py --plan
      - name: Descargar del espejo y comprobar el manifiesto
        if: steps.release.outputs.source_sha != ''
        env:
          FORGEJO_RELEASE_READ_TOKEN: ${{ secrets.FORGEJO_RELEASE_READ_TOKEN }}
          MIRROR_READ_TOKEN: ${{ secrets.MIRROR_READ_TOKEN }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: python3 automation/forgejo_source.py --sha "$SOURCE_SHA" --version "$RELEASE_VERSION" --destination "$RUNNER_TEMP/source"
      - name: Verificar todas las sumas del árbol sin credenciales
        if: steps.release.outputs.source_sha != ''
        working-directory: ${{ runner.temp }}/source
        run: sha256sum -c CONTENIDO.sha256 > "$RUNNER_TEMP/source-checksums.log"
