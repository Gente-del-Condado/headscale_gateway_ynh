name: Actualizar tienda F-Droid
'on':
  push:
    branches: [main]
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fdroid-store
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    env:
      FDROID_WORK: /tmp/fdroid-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pruebas del plan y sus rechazos
        run: python3 -B -m unittest discover -s automation -p 'test_*.py'
      - name: Detectar APK nuevas o renovación del índice
        id: plan
        run: python3 automation/sync.py --plan --work "$FDROID_WORK"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: steps.plan.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.plan.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar las herramientas oficiales
        if: steps.plan.outputs.changed == 'true'
        run: |
          python3 -m pip install -r requirements.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Validar APK y firmar el índice
        if: steps.plan.outputs.changed == 'true'
        env:
          FDROID_REPO_SIGNING_BUNDLE: ${{ secrets.FDROID_REPO_SIGNING_BUNDLE }}
        run: python3 automation/sync.py --work "$FDROID_WORK" --sdk "$ANDROID_HOME"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: steps.plan.outputs.changed == 'true'
        with:
          path: /tmp/fdroid-store/site
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar el repositorio ya verificado
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
