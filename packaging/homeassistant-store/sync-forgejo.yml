name: Verificar aplicaciones desde Forgejo
'on':
  schedule:
  - cron: 29 * * * *
  push:
    branches:
    - main
    paths:
    - .github/ha-images/**
    - .github/workflows/sync-forgejo.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: homeassistant-forgejo-sources
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      changed: ${{ steps.plan.outputs.changed }}
      images_pending: ${{ steps.plan.outputs.images_pending }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: plan
      name: Consultar cambios sin descargar ni ejecutar los proyectos
      env:
        FORGEJO_APPS_READ_TOKEN: ${{ secrets.FORGEJO_APPS_READ_TOKEN }}
      run: python3 .github/ha-images/forgejo_apps.py plan
  quality:
    name: ${{ matrix.repo }} · calidad pública
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Consultar el recibo de fuentes de la tienda
      run: git fetch --no-tags origin refs/heads/build-source:refs/remotes/origin/build-source
    - name: Descargar solo el main exacto de Forgejo sin historial
      id: source
      env:
        FORGEJO_APPS_READ_TOKEN: ${{ secrets.FORGEJO_APPS_READ_TOKEN }}
        SOURCE_REPO: ${{ matrix.repo }}
        SOURCE_SHA: ${{ matrix.sha }}
      run: python3 .github/ha-images/forgejo_apps.py download --repo "$SOURCE_REPO" --source "$RUNNER_TEMP/source" --sha "$SOURCE_SHA"
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      if: steps.source.outputs.changed == 'true'
      with:
        python-version: ${{ matrix.python }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      if: steps.source.outputs.changed == 'true' && matrix.repo == 'jacksignal'
      with:
        node-version: '22'
    - name: Comprobar PiVigia sin credenciales
      if: steps.source.outputs.changed == 'true' && matrix.repo == 'pivigia'
      working-directory: ${{ runner.temp }}/source
      run: 'set -euo pipefail

        python -m pip install pip-audit==2.10.1

        python -m pip_audit --disable-pip --no-deps -r requirements.lock

        python -m pip install -r requirements.lock

        python -m pip install -e ''.[dev]''

        python scripts/download_model.py

        ruff check src tests scripts custom_components

        pytest -q

        python scripts/sync_addon.py --check

        python scripts/i18n.py --check

        python scripts/sync_yunohost.py --check

        python scripts/release.py --check

        python -m pip install -r docs/requirements.txt

        mkdocs build --strict

        python scripts/check_manual.py

        sudo apt-get update -qq

        sudo apt-get install -y shellcheck

        shellcheck -s bash -e SC1091,SC2154 packaging/yunohost/scripts/* packaging/yunohost/conf/certificate-hook

        docker build -t pivigia:quality .

        docker build -t pivigia-addon:quality addons/pivigia

        '
    - name: Comprobar JackSignal sin credenciales
      if: steps.source.outputs.changed == 'true' && matrix.repo == 'jacksignal'
      working-directory: ${{ runner.temp }}/source
      run: 'set -euo pipefail

        sudo apt-get update -qq

        sudo apt-get install -y libpulse0 ffmpeg rsync

        python -m pip install -r requirements-test.txt pip-audit==2.10.1

        python -m pip check

        python -m pip_audit

        bash -n scripts/publish-ha.sh scripts/publish-store.sh

        python -m unittest discover -s tests -v

        node --test tests/test_panel_frontend.cjs

        '
    - name: Exportar solo el contexto público de la aplicación
      if: steps.source.outputs.changed == 'true'
      env:
        SOURCE_REPO: ${{ matrix.repo }}
      run: python3 .github/ha-images/forgejo_apps.py prepare --repo "$SOURCE_REPO" --source "$RUNNER_TEMP/source" --output
        "$RUNNER_TEMP/prepared"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: steps.source.outputs.changed == 'true'
      with:
        name: ${{ matrix.repo }}
        path: ${{ runner.temp }}/prepared/
        if-no-files-found: error
        retention-days: 1
        include-hidden-files: true
    needs: plan
    if: needs.plan.outputs.changed == 'true'
  stage:
    needs:
    - plan
    - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: true
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        path: ${{ runner.temp }}/prepared
    - name: Rechazar fuentes que ya no sean main en Forgejo
      env:
        FORGEJO_APPS_READ_TOKEN: ${{ secrets.FORGEJO_APPS_READ_TOKEN }}
      run: python3 .github/ha-images/forgejo_apps.py check --artifacts "$RUNNER_TEMP/prepared"
    - name: Publicar integraciones verificadas en sus destinos públicos
      env:
        GH_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
      run: python3 .github/ha-images/distributions.py --artifacts "$RUNNER_TEMP/prepared"
    - name: Actualizar únicamente build-source con sumas verificadas
      run: python3 .github/ha-images/forgejo_apps.py stage --artifacts "$RUNNER_TEMP/prepared"
      id: stage
    if: needs.plan.outputs.changed == 'true'
    outputs:
      images_changed: ${{ steps.stage.outputs.images_changed }}
  images:
    needs:
    - plan
    - stage
    if: always() && needs.plan.result == 'success' && (needs.stage.result == 'success' || needs.stage.result == 'skipped')
      && (needs.plan.outputs.images_pending == 'true' || needs.stage.outputs.images_changed == 'true')
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-images.yml
