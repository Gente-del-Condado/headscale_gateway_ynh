name: Construir y publicar aplicaciones precompiladas
'on':
  push:
    branches:
    - build-source
  workflow_dispatch: null
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: homeassistant-precompiled-store
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      apps: ${{ steps.plan.outputs.apps }}
      sha: ${{ steps.plan.outputs.sha }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - run: python3 -m pip install PyYAML==6.0.3
    - name: Pruebas del publicador sin credenciales
      run: python3 -B -m unittest discover -s .github/ha-images -p 'test_*.py'
    - name: Seleccionar versiones y árboles exactos pendientes
      id: plan
      run: python3 .github/ha-images/images.py plan
  build:
    name: ${{ matrix.app }} · ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 2GiB
      GOFLAGS: -p=2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.plan.outputs.sha }}
        persist-credentials: false
    - run: python3 -m pip install PyYAML==6.0.3
    - name: Autenticar solo el runner en GHCR
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
    - name: Compilar, probar arranque y publicar candidato inmutable
      env:
        APP: ${{ matrix.app }}
        ARCH: ${{ matrix.arch }}
        SOURCE_SHA: ${{ needs.plan.outputs.sha }}
      run: python3 .github/ha-images/images.py build --app "$APP" --arch "$ARCH" --sha "$SOURCE_SHA"
    - if: always()
      run: docker logout ghcr.io
  publish:
    needs:
    - plan
    - build
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
        persist-credentials: true
    - run: python3 -m pip install PyYAML==6.0.3
    - name: Autenticar solo el runner en GHCR
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
    - name: Verificar índices y acceso anónimo antes de actualizar la tienda
      env:
        ITEMS: ${{ needs.plan.outputs.apps }}
      run: python3 .github/ha-images/images.py publish --items "$ITEMS"
    - if: always()
      run: docker logout ghcr.io
