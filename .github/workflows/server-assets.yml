name: Recursos públicos del motor
on:
  push:
    branches: [main]
    paths: ['release-request.json', '.github/workflows/server-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: server-assets
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validar la petición y comprobar si ya está publicada
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, hashlib, tempfile
          from pathlib import Path
          r = json.loads(Path('release-request.json').read_text())
          assert r['format'] == 1 and re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', r['version'])
          assert re.fullmatch(r'[0-9a-f]{40}', r['source_commit'])
          assert set(r['sha256']) == {'headscale-gateway-linux-amd64','headscale-gateway-linux-arm64','source.tar.gz'}
          assert all(re.fullmatch(r'[0-9a-f]{64}', x) for x in r['sha256'].values())
          tag = 'server-v' + r['version']
          query = subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{tag}'],capture_output=True,text=True)
          exists = query.returncode == 0
          if query.returncode and 'HTTP 404' not in query.stderr:
              raise SystemExit(query.stderr)
          if exists:
              release = json.loads(query.stdout)
              assert not release['draft'] and not release['prerelease']
              with tempfile.TemporaryDirectory() as d:
                  subprocess.run(['gh','release','download',tag,'--dir',d],check=True)
                  for name, digest in r['sha256'].items():
                      assert hashlib.sha256((Path(d)/name).read_bytes()).hexdigest() == digest, name
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'source_commit={r["source_commit"]}\nexists={str(exists).lower()}\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.request.outputs.exists != 'true'
        with:
          ref: ${{ steps.request.outputs.source_commit }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.request.outputs.exists != 'true'
        with:
          go-version-file: engine/src/go.mod
          cache-dependency-path: engine/src/go.sum
      - name: Compilar desde el commit público exacto
        if: steps.request.outputs.exists != 'true'
        run: python3 engine/tools/package_platforms.py --output "$RUNNER_TEMP/server-assets" --no-archives
      - name: Verificar sumas y publicar los tres recursos inmutables
        if: steps.request.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, hashlib, subprocess
          from pathlib import Path
          r = json.loads(Path('release-request.json').read_text())
          p = Path(os.environ['RUNNER_TEMP'])/'server-assets/yunohost/payload'
          files = []
          for name, digest in r['sha256'].items():
              path = p/name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              files.append(str(path))
          tag = 'server-v'+r['version']
          subprocess.run(['gh','release','create',tag,*files,'--target',r['source_commit'],'--title','Motor '+r['version'],'--notes','Motor Linux amd64/arm64 y fuentes completos correspondientes con dependencias y licencias. Recursos verificados por el paquete YunoHost mediante SHA-256.'],check=True)
          # Una release en borrador no permite instalar desde una URL pública.
          subprocess.run(['gh','release','edit',tag,'--draft=false'],check=True)
          release = json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{tag}'],text=True))
          assert not release['draft'] and not release['prerelease']
          PY
      - name: Comprobar las descargas públicas sin autenticación
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          r = json.loads(Path('release-request.json').read_text())
          base = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/server-v{r["version"]}/'
          for name, expected in r['sha256'].items():
              with urllib.request.urlopen(base+name, timeout=120) as response:
                  assert hashlib.file_digest(response,'sha256').hexdigest() == expected, name
          PY
