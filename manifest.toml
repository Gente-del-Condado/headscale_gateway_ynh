#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json
packaging_format = 2
id = "headscale_gateway"
name = "Headscale Gateway"
description.en = "Private HTTPS access to services through Headscale, with DNS and certificate management"
description.es = "Gateway HTTPS privado con tsnet, DNS, certificados y administración"
version = "1.4.13~ynh1"
maintainers = ["Gente del Condado <headscale-gateway@gentedelcondado.es>"]

[upstream]
license = "AGPL-3.0-only"
code = "https://github.com/Gente-del-Condado/headscale_gateway_ynh/tree/upstream-source"
website = "https://gente-del-condado.github.io/headscale_gateway_ynh/"
admindoc = "https://gente-del-condado.github.io/headscale_gateway_ynh/YUNOHOST.html"
userdoc = "https://gente-del-condado.github.io/headscale_gateway_ynh/PRIMEROS_PASOS.html"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = false
sso = true
disk = "500M"
ram.build = "100M"
ram.runtime = "256M"

[install.domain]
type = "domain"

[install.path]
type = "path"
default = "/gateway"

[install.init_main_permission]
type = "group"
default = "admins"

[resources.system_user]

[resources.install_dir]

[resources.data_dir]

[resources.permissions]
main.url = "/"
main.auth_header = true

[resources.ports]
main.default = 19091
lan.default = 18443

[resources.apt]
packages = ["ca-certificates", "python3", "libc-bin"]

[resources.sources]

[resources.sources.main]
format = "file"
extract = false
rename = "headscale-gateway"
amd64.url = "https://github.com/Gente-del-Condado/headscale_gateway_ynh/releases/download/server-v1.4.13/headscale-gateway-linux-amd64"
amd64.sha256 = "7f4c62b59a337749c5b6cba6937ed15eab36f39139e4ade2ce976d634d1cd16a"
arm64.url = "https://github.com/Gente-del-Condado/headscale_gateway_ynh/releases/download/server-v1.4.13/headscale-gateway-linux-arm64"
arm64.sha256 = "15c8a757c2175f992e5f18a3a3171c447db5eb898048b495c98e9889fad59935"

[resources.sources.build_sources]
format = "tar.gz"
extract = false
rename = "source.tar.gz"
url = "https://github.com/Gente-del-Condado/headscale_gateway_ynh/releases/download/server-v1.4.13/source.tar.gz"
sha256 = "eba25ca61552642effec8fbaf8aa7edbe6532a94eb6387246c4686be4a9c30dd"
