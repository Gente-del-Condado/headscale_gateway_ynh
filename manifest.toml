#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json
packaging_format = 2
id = "headscale_gateway"
name = "Headscale Gateway"
description.en = "Private HTTPS access to services through Headscale, with DNS and certificate management"
description.es = "Gateway HTTPS privado con tsnet, DNS, certificados y administración"
version = "1.4.16~ynh1"
maintainers = ["Gente del Condado <headscale-gateway@gentedelcondado.es>"]

[upstream]
license = "AGPL-3.0-only"
code = "https://github.com/Gente-del-Condado/headscale_gateway_ynh/tree/upstream-source"
website = "https://gente-del-condado.github.io/headscale_gateway_ynh/"
admindoc = "https://gente-del-condado.github.io/headscale_gateway_ynh/YUNOHOST.html"
userdoc = "https://gente-del-condado.github.io/headscale_gateway_ynh/PRIMEROS_PASOS.html"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = false
sso = true
disk = "500M"
ram.build = "100M"
ram.runtime = "256M"

[install.domain]
type = "domain"

[install.path]
type = "path"
default = "/gateway"

[install.init_main_permission]
type = "group"
default = "admins"

[resources.system_user]

[resources.install_dir]

[resources.data_dir]

[resources.permissions]
main.url = "/"
main.auth_header = true

[resources.ports]
main.default = 19091
lan.default = 18443

[resources.apt]
packages = ["ca-certificates", "python3", "libc-bin"]

[resources.sources]

[resources.sources.main]
format = "file"
extract = false
rename = "headscale-gateway"
amd64.url = "https://github.com/Gente-del-Condado/headscale_gateway_ynh/releases/download/server-v1.4.16/headscale-gateway-linux-amd64"
amd64.sha256 = "28f223b1324c0446b5a95ceb06edcc081d52e2c611faa082602f256ac5e3d022"
arm64.url = "https://github.com/Gente-del-Condado/headscale_gateway_ynh/releases/download/server-v1.4.16/headscale-gateway-linux-arm64"
arm64.sha256 = "3f1ce0c9c978a372e846a234f101166606f9e2cd3c6afa5327638a26e9f77946"

[resources.sources.build_sources]
format = "tar.gz"
extract = false
rename = "source.tar.gz"
url = "https://github.com/Gente-del-Condado/headscale_gateway_ynh/releases/download/server-v1.4.16/source.tar.gz"
sha256 = "87bb30677764c82d9193bc62ca6757a59a2153fb06895c3d3696dc4546f66097"
