#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json
packaging_format = 2
id = "headscale_gateway"
name = "Headscale Gateway"
description.en = "Private HTTPS access to services through Headscale, with DNS and certificate management"
description.es = "Gateway HTTPS privado con tsnet, DNS, certificados y administración"
version = "1.4.8~ynh1"
maintainers = ["Gente-del-Condado"]

[upstream]
license = "AGPL-3.0-only"
code = "https://github.com/Gente-del-Condado/headscale_gateway_ynh/tree/upstream-source"
website = "https://gente-del-condado.github.io/headscale_gateway_ynh/"
admindoc = "https://gente-del-condado.github.io/headscale_gateway_ynh/YUNOHOST.html"
userdoc = "https://gente-del-condado.github.io/headscale_gateway_ynh/PRIMEROS_PASOS.html"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = false
sso = true
disk = "500M"
ram.build = "100M"
ram.runtime = "256M"

[install.domain]
type = "domain"

[install.path]
type = "path"
default = "/gateway"

[install.init_main_permission]
type = "group"
default = "admins"

[resources.system_user]

[resources.install_dir]

[resources.data_dir]

[resources.permissions]
main.url = "/"
main.auth_header = true

[resources.ports]
main.default = 19091
lan.default = 18443

[resources.apt]
packages = ["ca-certificates", "python3", "libc-bin"]

[resources.sources]

[resources.sources.main]
format = "file"
extract = false
rename = "headscale-gateway"
amd64.url = "https://github.com/Gente-del-Condado/headscale_gateway_ynh/releases/download/server-v1.4.8/headscale-gateway-linux-amd64"
amd64.sha256 = "96b9a745fce8820a1e2dd43a82f20e59c7823b9f551e4ee755d3067013fa75d2"
arm64.url = "https://github.com/Gente-del-Condado/headscale_gateway_ynh/releases/download/server-v1.4.8/headscale-gateway-linux-arm64"
arm64.sha256 = "a6ec55b534e5338539d24a22f559e0364f100cd23df95baf1d6692487fc45970"

[resources.sources.build_sources]
format = "tar.gz"
extract = false
rename = "source.tar.gz"
url = "https://github.com/Gente-del-Condado/headscale_gateway_ynh/releases/download/server-v1.4.8/source.tar.gz"
sha256 = "7e44f3f783b5af8a786760036987e69ad07976836e78a67c8a084bb56261cdcb"
